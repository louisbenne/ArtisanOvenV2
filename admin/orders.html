      <a href="orders.html"   data-page="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Orders</a>
      <a href="kitchen.html"  data-page="kitchen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Kitchen</a>

      <a href="money.html"    data-page="money" data-min-role="treasurer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v1m0 8v1M9.5 9.5C9.5 8.7 10.6 8 12 8s2.5.7 2.5 1.5S13.4 11 12 11s-2.5.7-2.5 1.5S10.6 16 12 16s2.5-.7 2.5-1.5"/></svg>Money</a>
      <a href="comms.html"    data-page="comms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Comms</a>
      <a href="settings.html" data-page="settings" data-min-role="owner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../frontend/index.html" target="_blank"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><line x1="10" y1="14" x2="21" y2="3"/></svg>View site</a>
      <a href="#" id="logout-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Log out</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
      <h1>Orders</h1>
      <span class="text-sm text-muted">Hi, <span class="js-admin-user"></span></span>
    </header>

    <div class="admin-content">

      <!-- Filter bar -->
      <div class="filter-bar">
        <input type="search" id="search-input" placeholder="Search name, code, email…" aria-label="Search orders">
        <select id="filter-status" aria-label="Payment status">
          <option value="">All statuses</option>
          <option value="unpaid">Unpaid</option>
          <option value="partial">Partial</option>
          <option value="paid">Paid</option>
        </select>
        <select id="filter-type" aria-label="Order type">
          <option value="">All types</option>
          <option value="lunch">Lunch</option>
          <option value="event">Event</option>
          <option value="parent">Parent</option>
        </select>
        <button class="btn btn-outline btn-sm" id="export-btn">Export CSV</button>
      </div>

      <!-- Orders list -->
      <div id="orders-list" aria-live="polite">
        <p class="text-muted">Loading orders…</p>
      </div>

      <!-- Pagination -->
      <div id="pagination" style="display:flex;gap:var(--space-sm);align-items:center;margin-top:var(--space-lg);flex-wrap:wrap"></div>

    </div>
  </div>
</div>

<!-- Payment modal -->
<dialog id="payment-modal" style="border:none;border-radius:var(--radius-lg);padding:var(--space-xl);max-width:420px;width:90%">
  <h2 style="margin-bottom:var(--space-lg)">Record Payment</h2>
  <form id="payment-form">
    <input type="hidden" id="pay-order-id">
    <div class="form-group">
      <label for="pay-amount">Amount (£)</label>
      <input type="number" id="pay-amount" min="0.01" step="0.01" required>
    </div>
    <div class="form-group">
      <label for="pay-method">Method</label>
      <select id="pay-method" required>
        <option value="cash">Cash</option>
        <option value="bank_transfer">Bank transfer</option>
        <option value="paypal">PayPal</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="pay-ref">Reference <span class="text-muted text-sm">(optional)</span></label>
      <input type="text" id="pay-ref" placeholder="Transaction ref, note…">
    </div>
    <div class="flex gap-sm mt-lg" style="justify-content:flex-end">
      <button type="button" class="btn btn-outline" id="cancel-payment-btn">Cancel</button>
      <button type="submit" class="btn btn-forest">Record</button>
    </div>
  </form>
</dialog>

<script src="admin-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { apiGet, apiPost, apiPatch } = window.aoAdmin;
  let page = 1;
  const LIMIT = 25;

  async function loadOrders() {
    const search = document.getElementById('search-input').value.trim();
    const status = document.getElementById('filter-status').value;
    const type   = document.getElementById('filter-type').value;

    const data = await apiGet('/admin/orders', {
      q: search || undefined, status: status || undefined,
      type: type || undefined, page, limit: LIMIT,
    });

    renderOrders(data.orders || []);
    renderPagination(data.total || 0);
  }

  function renderOrders(orders) {
    const el = document.getElementById('orders-list');
    if (!orders.length) { el.innerHTML = '<p class="text-muted">No orders found.</p>'; return; }
    el.innerHTML = orders.map(renderOrder).join('');
  }

  function renderOrder(o) {
    const items = (o.items || []).map(i => `${i.topping} (${i.size})`).join(', ');
    const statusClass = o.paymentStatus === 'paid' ? 'badge-success' : o.paymentStatus === 'partial' ? 'badge-warning' : 'badge-muted';
    return `
      <div class="order-card">
        <div class="order-card-header">
          <div style="display:flex;align-items:center;gap:var(--space-sm)">
            <strong>${escHtml(o.orderId)}</strong>
            <span class="badge ${statusClass}">${o.paymentStatus}</span>
            <span class="badge badge-muted" style="font-size:.7rem">${o.orderType}</span>
          </div>
          <span class="text-sm text-muted">${new Date(o.createdAt).toLocaleDateString('en-GB')}</span>
        </div>
        <div class="order-card-body">
          <strong>${escHtml(o.customerName)}</strong>
          ${o.email ? `<span class="text-muted"> · ${escHtml(o.email)}</span>` : ''}
          <div class="text-muted mt-xs">${escHtml(items)}</div>
          ${o.notes ? `<div class="text-muted text-sm mt-xs">📝 ${escHtml(o.notes)}</div>` : ''}
        </div>
        <div class="order-card-actions">
          <span class="text-sm" style="font-weight:600">£${((o.totalPence||0)/100).toFixed(2)}</span>
          ${o.paidPence ? `<span class="text-sm text-muted"> · £${(o.paidPence/100).toFixed(2)} paid</span>` : ''}
          <button class="btn btn-forest btn-sm record-pay-btn" data-id="${escHtml(o.orderId)}" data-owed="${o.totalPence - (o.paidPence||0)}" data-min-role="treasurer">Record payment</button>
          ${o.paymentStatus !== 'paid'
            ? `<button class="btn btn-outline btn-sm waive-btn" data-id="${escHtml(o.orderId)}" data-min-role="treasurer">Waive</button>`
            : ''}
        </div>
      </div>`;
  }

  function renderPagination(total) {
    const pages = Math.ceil(total / LIMIT);
    const el    = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <button class="btn btn-outline btn-sm" id="prev-btn" ${page === 1 ? 'disabled' : ''}>← Prev</button>
      <span class="text-sm text-muted">Page ${page} of ${pages} · ${total} orders</span>
      <button class="btn btn-outline btn-sm" id="next-btn" ${page >= pages ? 'disabled' : ''}>Next →</button>
    `;
    document.getElementById('prev-btn')?.addEventListener('click', () => { page--; loadOrders(); });
    document.getElementById('next-btn')?.addEventListener('click', () => { page++; loadOrders(); });
  }

  // Search / filter
  let debounce;
  document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { page = 1; loadOrders(); }, 300);
  });
  ['filter-status','filter-type'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => { page = 1; loadOrders(); });
  });

  // Record payment modal
  document.addEventListener('click', e => {
    const btn = e.target.closest('.record-pay-btn');
    if (btn && window.aoAdmin.hasRole('treasurer')) {
      document.getElementById('pay-order-id').value = btn.dataset.id;
      const owed = parseInt(btn.dataset.owed, 10);
      document.getElementById('pay-amount').value = owed > 0 ? (owed / 100).toFixed(2) : '';
      document.getElementById('payment-modal').showModal();
    }
  });
  document.getElementById('cancel-payment-btn').addEventListener('click', () => {
    document.getElementById('payment-modal').close();
  });
  document.getElementById('payment-form').addEventListener('submit', async e => {
    e.preventDefault();
    const orderId = document.getElementById('pay-order-id').value;
    const data = await apiPost('/admin/payments', {
      orderId,
      amountPence: Math.round(parseFloat(document.getElementById('pay-amount').value) * 100),
      method:      document.getElementById('pay-method').value,
      reference:   document.getElementById('pay-ref').value.trim() || null,
    });
    if (data.success) { document.getElementById('payment-modal').close(); loadOrders(); }
    else alert(data.message);
  });

  // Export CSV
  document.getElementById('export-btn').addEventListener('click', async () => {
    const url = new URL((window.ORDER_API_URL || '/api') + '/admin/money/export', location.origin);
    window.open(url.toString(), '_blank');
  });

  // Socket live updates
  const socket = window.aoAdmin.connectSocket('/admin');
  socket?.on('order:created',    loadOrders);
  socket?.on('payment:recorded', loadOrders);

  loadOrders();
});

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
