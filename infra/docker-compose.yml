# Base stack shared by dev and prod: Postgres + API + nightly backup.
# Never run this file alone — use the npm wrappers in the root package.json:
#   npm run dev       (this + docker-compose.dev.yml)
#   npm run prod:up   (this + docker-compose.prod.yml)
#
# Secrets and settings: infra/.env (copy infra/.env.example).

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       artisanoven
      POSTGRES_USER:     artisanoven
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artisanoven -d artisanoven"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API + static site (runs migrations on start) ─────────────────────────────
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: artisanoven
      DB_USER: artisanoven
      DB_PASS: ${DB_PASS}
      PORT:    "3000"
    depends_on:
      db:
        condition: service_healthy

  # ── Nightly backup (one on start, then every 24h; keeps 14 days) ─────────────
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASS}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  backup_data:
