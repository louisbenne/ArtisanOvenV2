# Production stack: Postgres + backend + Caddy (TLS) + nightly backups.
#
#   cd infra
#   docker compose up -d --build
#
# Reads secrets from ../.env (backend) and infra/.env (DB_PASS, SITE_ADDRESS).

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       artisanoven
      POSTGRES_USER:     artisanoven
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in infra/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artisanoven -d artisanoven"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Backend API (runs migrations on start) ───────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: artisanoven
      DB_USER: artisanoven
      DB_PASS: ${DB_PASS}
      PORT:    "3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, web]

  # ── Caddy (reverse proxy + auto HTTPS) ───────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks: [web]

  # ── Nightly backup (one on start, then every 24h) ────────────────────────────
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASS}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
  web:

volumes:
  db_data:
  caddy_data:
  caddy_config:
  backup_data:
