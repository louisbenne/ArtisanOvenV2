<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find &amp; Pay — Artisan Oven</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-logo">ARTISAN OVEN</a>
      <nav class="site-nav" aria-label="Main">
        <a href="order.html">Order</a>
        <a href="payment.html" aria-current="page">Pay</a>
        <a href="events.html">Events</a>
        <a href="terms.html">Terms</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container" style="max-width:600px">
      <h1 style="margin-top:var(--space-xl);margin-bottom:var(--space-xs)">Find your order</h1>
      <p class="text-muted text-sm">Look up an order by code or email address.</p>

      <!-- Lookup form -->
      <form id="lookup-form" style="margin-top:var(--space-lg)" novalidate>
        <div class="form-group">
          <label for="lookup-input">Order code or email</label>
          <input type="text" id="lookup-input" name="q" placeholder="e.g. L-0012 or jane@example.com"
                 autocomplete="off" required>
          <span class="form-hint">Order codes start with L-, E- or P-</span>
        </div>
        <button type="submit" class="btn btn-forest" id="lookup-btn">Look up</button>
      </form>

      <div id="lookup-error" class="alert alert-error hidden mt-md" role="alert"></div>

      <!-- Results -->
      <div id="lookup-results" class="hidden" style="margin-top:var(--space-xl)">
        <!-- Filled by JS -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span class="js-year"></span> Artisan Oven</span>
        <span><a href="terms.html">Terms</a></span>
      </div>
    </div>
  </footer>

  <script src="site.js" defer></script>
  <script>
  const API = window.ORDER_API_URL || '/api';

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.js-year').forEach(el => el.textContent = new Date().getFullYear());

    // Auto-populate from order.html sessionStorage hand-off
    try {
      const last = JSON.parse(sessionStorage.getItem('ao_last_order') || 'null');
      if (last?.orderId) {
        document.getElementById('lookup-input').value = last.orderId;
        doLookup(last.orderId);
        return;
      }
    } catch {}

    // Auto-populate from URL params
    const params = new URLSearchParams(location.search);
    const q = params.get('q') || params.get('order') || params.get('code');
    if (q) {
      document.getElementById('lookup-input').value = q;
      doLookup(q);
    }

    document.getElementById('lookup-form').addEventListener('submit', e => {
      e.preventDefault();
      doLookup(document.getElementById('lookup-input').value.trim());
    });
  });

  async function doLookup(q) {
    const errEl = document.getElementById('lookup-error');
    const resEl = document.getElementById('lookup-results');
    errEl.classList.add('hidden');
    resEl.classList.add('hidden');

    const btn = document.getElementById('lookup-btn');
    btn.disabled   = true;
    btn.textContent = 'Looking up…';

    try {
      const url = new URL(`${API}/orders/lookup`, location.origin);
      url.searchParams.set('q', q);
      const res  = await fetch(url);
      const data = await res.json();

      if (!data.success || !data.order) {
        errEl.textContent = data.message || 'Order not found.';
        errEl.classList.remove('hidden');
      } else {
        resEl.innerHTML = renderOrder(data.order);
        resEl.classList.remove('hidden');
        resEl.querySelectorAll('.copy-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            navigator.clipboard?.writeText(btn.dataset.copy)
              .then(() => { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); })
              .catch(() => {});
          });
        });
      }
    } catch {
      errEl.textContent = 'Network error — please try again.';
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled   = false;
      btn.textContent = 'Look up';
    }
  }

  function statusLabel(s) {
    if (s === 'paid')    return '<span class="badge badge-success">Paid</span>';
    if (s === 'partial') return '<span class="badge badge-warning">Partial</span>';
    return '<span class="badge badge-muted">Unpaid</span>';
  }

  const SIZE_LABEL = { '12inch': 'Whole 12"', 'Half12inch': 'Half 12"', 'Quarter12inch': 'Quarter 12"' };

  function renderOrder(o) {
    const amountPaid = o.amountPaidPence || 0;
    const outstanding = Math.max(0, o.totalPence - amountPaid);

    const items = (o.items || []).map(item =>
      `<tr>
        <td style="padding:6px 0">${escHtml(item.topping || '—')}</td>
        <td style="padding:6px 0">${escHtml(SIZE_LABEL[item.size] || item.size)}</td>
        <td style="padding:6px 0;text-align:right">£${(item.pricePence / 100).toFixed(2)}</td>
      </tr>`
    ).join('');

    return `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-bottom:var(--space-md)">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-sm)">
          <h2 style="font-size:1.3rem;letter-spacing:.06em">${escHtml(o.orderId)}</h2>
          ${statusLabel(o.paymentStatus)}
        </div>
        <p class="text-muted text-sm mt-sm">${escHtml(o.customerName)}</p>
        <table style="width:100%;border-collapse:collapse;font-size:.9rem;margin-top:var(--space-md)">
          <thead>
            <tr style="border-bottom:1px solid var(--border)">
              <th style="text-align:left;padding:4px 0;color:var(--text-400);font-weight:600">Topping</th>
              <th style="text-align:left;padding:4px 0;color:var(--text-400);font-weight:600">Size</th>
              <th style="text-align:right;padding:4px 0;color:var(--text-400);font-weight:600">Price</th>
            </tr>
          </thead>
          <tbody>${items}</tbody>
          <tfoot>
            ${o.discountPence ? `<tr><td colspan="2" style="padding:4px 0;color:var(--text-400)">Discount (${escHtml(o.discountCode)})</td><td style="padding:4px 0;text-align:right;color:var(--text-400)">−£${(o.discountPence / 100).toFixed(2)}</td></tr>` : ''}
            <tr style="border-top:2px solid var(--border)">
              <td colspan="2" style="padding-top:8px;font-weight:700">Total</td>
              <td style="padding-top:8px;text-align:right;font-weight:700">£${(o.totalPence / 100).toFixed(2)}</td>
            </tr>
            ${amountPaid > 0 ? `<tr><td colspan="2" style="padding:2px 0;color:var(--text-400)">Paid</td><td style="padding:2px 0;text-align:right;color:var(--text-400)">£${(amountPaid / 100).toFixed(2)}</td></tr>` : ''}
            ${outstanding > 0 ? `<tr><td colspan="2" style="padding:2px 0;font-weight:600">Outstanding</td><td style="padding:2px 0;text-align:right;font-weight:600">£${(outstanding / 100).toFixed(2)}</td></tr>` : ''}
          </tfoot>
        </table>
        ${o.paymentStatus !== 'paid' ? `
        <div style="background:var(--cream-800);border-radius:var(--radius-md);padding:var(--space-md);font-size:.9rem;margin-top:var(--space-md)">
          <strong>How to pay</strong>
          <ul style="margin:.5rem 0 0;padding-left:1.4rem">
            <li>Cash at collection — just say your order code <strong>${escHtml(o.orderId)}</strong></li>
            <li>Bank transfer — ask a member of staff for details</li>
          </ul>
        </div>` : `
        <p class="text-sm mt-md" style="color:var(--forest)">✓ Payment received — thank you!</p>`}
      </div>`;
  }

  function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  </script>
</body>
</html>
