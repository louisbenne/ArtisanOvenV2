  <div class="admin-main">
    <header class="admin-topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
      <h1>Events</h1>
      <span class="text-sm text-muted">Hi, <span class="js-admin-user"></span></span>
    </header>

    <div class="admin-content">
      <div style="display:flex;justify-content:flex-end;margin-bottom:var(--space-lg)">
        <button class="btn btn-forest btn-sm" id="new-event-btn">+ New event</button>
      </div>
      <div id="events-list" aria-live="polite">
        <p class="text-muted">Loading…</p>
      </div>
    </div>
  </div>
</div>

<!-- Event modal -->
<dialog id="event-modal" style="border:none;border-radius:var(--radius-lg);padding:var(--space-xl);max-width:480px;width:90%">
  <h2 style="margin-bottom:var(--space-lg)" id="event-modal-title">New Event</h2>
  <form id="event-form">
    <input type="hidden" id="ev-id">
    <div class="form-group">
      <label for="ev-title">Title *</label>
      <input type="text" id="ev-title" required>
    </div>
    <div class="form-group">
      <label for="ev-date">Event date *</label>
      <input type="date" id="ev-date" required>
    </div>
    <div class="form-group">
      <label for="ev-location">Location</label>
      <input type="text" id="ev-location" placeholder="e.g. School hall">
    </div>
    <div class="form-group">
      <label for="ev-desc">Description</label>
      <textarea id="ev-desc" rows="3"></textarea>
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:var(--space-sm)">
      <input type="checkbox" id="ev-open" style="margin:0">
      <label for="ev-open" style="margin:0;font-weight:400;cursor:pointer">Ordering open</label>
    </div>
    <div class="flex gap-sm mt-lg" style="justify-content:flex-end">
      <button type="button" class="btn btn-outline" id="cancel-ev-btn">Cancel</button>
      <button type="submit" class="btn btn-forest" id="ev-submit-btn">Save</button>
    </div>
  </form>
</dialog>

<script src="admin-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { apiGet, apiPost, apiPatch, apiDelete } = window.aoAdmin;

  async function loadEvents() {
    const data = await apiGet('/admin/events');
    const events = data.events || [];
    const el = document.getElementById('events-list');
    if (!events.length) { el.innerHTML = '<p class="text-muted">No events yet.</p>'; return; }
    el.innerHTML = events.map(renderEvent).join('');
  }

  function renderEvent(ev) {
    const isOpen = ev.status === 'Open';
    const date = ev.event_date ? new Date(ev.event_date).toLocaleDateString('en-GB', { weekday:'short', year:'numeric', month:'short', day:'numeric' }) : '—';
    return `
      <div class="order-card">
        <div class="order-card-header">
          <strong>${escHtml(ev.name)}</strong>
          <span class="badge ${isOpen ? 'badge-success' : 'badge-muted'}">${isOpen ? 'Open' : 'Closed'}</span>
        </div>
        <div class="order-card-body text-sm">
          ${date}${ev.location ? ' · ' + escHtml(ev.location) : ''}
        </div>
        <div class="order-card-actions">
          <button class="btn btn-outline btn-sm edit-ev-btn" data-id="${ev.id}">Edit</button>
          <button class="btn btn-outline btn-sm toggle-ev-btn" data-id="${ev.id}" data-open="${isOpen}">${isOpen ? 'Close' : 'Open'} booking</button>
          <button class="btn btn-outline btn-sm view-interest-btn" data-id="${ev.id}">Interest (${ev.interest_count || 0})</button>
        </div>
      </div>`;
  }

  // New event
  document.getElementById('new-event-btn').addEventListener('click', () => {
    document.getElementById('ev-id').value = '';
    document.getElementById('event-form').reset();
    document.getElementById('event-modal-title').textContent = 'New Event';
    document.getElementById('event-modal').showModal();
  });
  document.getElementById('cancel-ev-btn').addEventListener('click', () => document.getElementById('event-modal').close());

  document.addEventListener('click', async e => {
    const edit = e.target.closest('.edit-ev-btn');
    if (edit) {
      const data = await apiGet(`/admin/events/${edit.dataset.id}`);
      const ev = data.event || {};
      document.getElementById('ev-id').value       = ev.id;
      document.getElementById('ev-title').value    = ev.name || '';
      document.getElementById('ev-date').value     = ev.event_date ? ev.event_date.slice(0,10) : '';
      document.getElementById('ev-location').value = ev.location || '';
      document.getElementById('ev-desc').value     = ev.customer_instructions || '';
      document.getElementById('ev-open').checked   = ev.status === 'Open';
      document.getElementById('event-modal-title').textContent = 'Edit Event';
      document.getElementById('event-modal').showModal();
    }

    const toggle = e.target.closest('.toggle-ev-btn');
    if (toggle) {
      const open = toggle.dataset.open === 'true';
      await apiPatch(`/admin/events/${toggle.dataset.id}`, { status: open ? 'Closed' : 'Open' });
      loadEvents();
    }
  });

  document.getElementById('event-form').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('ev-id').value;
    const orderingOpen = document.getElementById('ev-open').checked;
    const body = {
      name:                 document.getElementById('ev-title').value.trim(),
      eventDate:            document.getElementById('ev-date').value,
      location:             document.getElementById('ev-location').value.trim() || null,
      customerInstructions: document.getElementById('ev-desc').value.trim()     || null,
      status:               orderingOpen ? 'Open' : 'Closed',
    };
    const data = id
      ? await apiPatch(`/admin/events/${id}`, body)
      : await apiPost('/admin/events', body);
    if (data.success) { document.getElementById('event-modal').close(); loadEvents(); }
    else alert(data.message);
  });

  loadEvents();
});

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
