<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Artisan Oven</title>
  <link rel="stylesheet" href="admin-shell.css">
</head>
<body style="background:var(--forest-800);display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:var(--space-lg)">
<script>window.ADMIN_PAGE = 'login';</script>

  <div class="card" style="width:100%;max-width:380px;text-align:center">
    <div style="margin-bottom:var(--space-lg)">
      <h1 class="font-brand" style="font-size:1.4rem;letter-spacing:.08em;color:var(--forest-800)">ARTISAN OVEN</h1>
      <p class="text-muted text-sm mt-sm">Admin access</p>
    </div>

    <div id="error-msg" class="alert alert-error hidden" role="alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="password">Password</label>
        <div style="position:relative">
          <input type="password" id="password" name="password" autocomplete="current-password" required autofocus style="padding-right:40px">
          <button type="button" id="show-pw" aria-label="Show password"
            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-400)">
            👁
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-forest btn-full mt-md" id="login-btn">Log In</button>
    </form>
  </div>

  <script>
    const API = window.ORDER_API_URL || '/api';
    const form   = document.getElementById('login-form');
    const errMsg = document.getElementById('error-msg');

    document.getElementById('show-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      errMsg.classList.add('hidden');

      try {
        const res  = await fetch(`${API}/admin/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ password: form.password.value }),
        });
        const data = await res.json();

        if (!data.success) {
          errMsg.textContent = data.message || 'Login failed.';
          errMsg.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Log In';
          return;
        }

        localStorage.setItem('ao_admin_token', data.token);
        localStorage.setItem('ao_admin_role',  data.role);
        localStorage.setItem('ao_admin_user',  data.username);
        location.href = 'index.html';
      } catch {
        errMsg.textContent = 'Network error — please try again.';
        errMsg.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
