  <aside class="admin-sidebar" aria-label="Admin navigation">

    <nav class="sidebar-nav" aria-label="Admin pages">

      <a href="orders.html"   data-page="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Orders</a>
      <a href="kitchen.html"  data-page="kitchen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Kitchen</a>

      <a href="money.html"    data-page="money" data-min-role="treasurer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v1m0 8v1M9.5 9.5C9.5 8.7 10.6 8 12 8s2.5.7 2.5 1.5S13.4 11 12 11s-2.5.7-2.5 1.5S10.6 16 12 16s2.5-.7 2.5-1.5"/></svg>Money</a>
      <a href="comms.html"    data-page="comms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Comms</a>

    </nav>
    <div class="sidebar-bottom">
      <a href="../frontend/index.html" target="_blank"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><line x1="10" y1="14" x2="21" y2="3"/></svg>View site</a>
      <a href="#" id="logout-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Log out</a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
      <h1>Money</h1>
      <span class="text-sm text-muted">Hi, <span class="js-admin-user"></span></span>
    </header>

    <div class="admin-content">

      <!-- Summary metrics -->
      <div class="metric-grid" id="money-metrics">
        <div class="metric-card skeleton" style="height:90px"></div>
        <div class="metric-card skeleton" style="height:90px"></div>
        <div class="metric-card skeleton" style="height:90px"></div>
        <div class="metric-card skeleton" style="height:90px"></div>
      </div>

      <!-- Breakdown by method + unpaid list -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);margin-top:var(--space-xl)" id="money-grid">
        <div class="card">
          <p class="card-title">By payment method</p>
          <div id="method-breakdown" class="text-sm">Loading…</div>
        </div>
        <div class="card">
          <p class="card-title">Outstanding (unpaid / partial)</p>
          <div id="outstanding-list" class="text-sm" style="max-height:280px;overflow-y:auto">Loading…</div>
        </div>
      </div>

      <!-- Export -->
      <div style="margin-top:var(--space-xl);display:flex;gap:var(--space-sm)">
        <button class="btn btn-outline" id="export-csv-btn">Export orders CSV</button>
        <button class="btn btn-outline" id="export-payments-btn">Export payments CSV</button>
      </div>

    </div>
  </div>
</div>

<script src="admin-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { apiGet } = window.aoAdmin;

  async function loadSummary() {
    const data = await apiGet('/admin/money/summary');
    renderMetrics(data.totals || {});
    renderMethodBreakdown(data.byMethod || []);
    renderOutstanding(data.outstanding || []);
  }

  function renderMetrics(t) {
    document.getElementById('money-metrics').innerHTML = `
      <div class="metric-card">
        <div class="metric-label">Gross</div>
        <div class="metric-value">£${(t.gross_pence != null ? t.gross_pence / 100 : 0).toFixed(2)}</div>
        <div class="metric-hint">${t.order_count ?? 0} orders</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Collected</div>
        <div class="metric-value">£${(t.collected_pence != null ? t.collected_pence / 100 : 0).toFixed(2)}</div>
        <div class="metric-hint">${t.paid_count ?? 0} fully paid</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Outstanding</div>
        <div class="metric-value" style="color:var(--terra-600)">£${(t.outstanding_pence != null ? t.outstanding_pence / 100 : 0).toFixed(2)}</div>
        <div class="metric-hint">${t.unpaid_count ?? 0} unpaid · ${t.partial_count ?? 0} partial</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Discounts given</div>
        <div class="metric-value">£${(t.discount_pence != null ? t.discount_pence / 100 : 0).toFixed(2)}</div>
        <div class="metric-hint">${t.discount_uses ?? 0} uses</div>
      </div>
    `;
  }

  function renderMethodBreakdown(methods) {
    const el = document.getElementById('method-breakdown');
    if (!methods.length) { el.textContent = 'No payments yet.'; return; }
    el.innerHTML = methods.map(m => `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--cream-800)">
        <span>${escHtml(m.method)}</span>
        <span><strong>£${((m.total_pence || 0)/100).toFixed(2)}</strong> <span class="text-muted">${m.count}×</span></span>
      </div>`).join('');
  }

  function renderOutstanding(rows) {
    const el = document.getElementById('outstanding-list');
    if (!rows.length) { el.innerHTML = '<p class="text-muted">All paid up!</p>'; return; }
    el.innerHTML = rows.map(r => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--cream-800)">
        <div>
          <strong>${escHtml(r.orderId)}</strong>
          <span class="text-muted"> — ${escHtml(r.customerName)}</span>
        </div>
        <span style="color:var(--terra-600);font-weight:600">£${((r.owedPence || 0)/100).toFixed(2)}</span>
      </div>`).join('');
  }

  document.getElementById('export-csv-btn').addEventListener('click', () => {
    window.open((window.ORDER_API_URL || '/api') + '/admin/money/export', '_blank');
  });
  document.getElementById('export-payments-btn').addEventListener('click', () => {
    window.open((window.ORDER_API_URL || '/api') + '/admin/money/export?type=payments', '_blank');
  });

  loadSummary();
  setInterval(loadSummary, 30_000);
});

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
