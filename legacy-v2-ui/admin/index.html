<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Artisan Oven Admin</title>
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="manifest" href="admin-manifest.json">
</head>
<body>
<script>window.ADMIN_PAGE = 'dashboard';</script>

<div class="admin-layout">

  <!-- ── Sidebar ───────────────────────────────────────────────────────────── -->
  <aside class="admin-sidebar" aria-label="Admin navigation">
    <div class="sidebar-logo">
      🍕 ARTISAN OVEN
      <small>Admin</small>
      <span class="role-badge js-admin-role"></span>
    </div>
    <nav class="sidebar-nav" aria-label="Admin pages">
      <a href="index.html"    data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="orders.html"   data-page="orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Orders
      </a>
      <a href="kitchen.html"  data-page="kitchen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Kitchen
      </a>
      <a href="events.html"   data-page="events">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Events
      </a>
      <a href="money.html"    data-page="money" data-min-role="treasurer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v1m0 8v1M9.5 9.5C9.5 8.7 10.6 8 12 8s2.5.7 2.5 1.5S13.4 11 12 11s-2.5.7-2.5 1.5S10.6 16 12 16s2.5-.7 2.5-1.5"/></svg>
        Money
      </a>
      <a href="comms.html"    data-page="comms">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Comms
      </a>
      <a href="settings.html" data-page="settings" data-min-role="owner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-bottom">
      <a href="../frontend/index.html" target="_blank">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        View site
      </a>
      <a href="#" id="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </a>
    </div>
  </aside>

  <!-- ── Main ──────────────────────────────────────────────────────────────── -->
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
      <h1>Dashboard</h1>
      <span class="text-sm text-muted">Hi, <span class="js-admin-user"></span></span>
    </header>

    <div class="admin-content">

      <!-- Live metric cards -->
      <div class="metric-grid" id="metric-grid" aria-live="polite">
        <div class="metric-card skeleton" style="height:90px"></div>
        <div class="metric-card skeleton" style="height:90px"></div>
        <div class="metric-card skeleton" style="height:90px"></div>
        <div class="metric-card skeleton" style="height:90px"></div>
      </div>

      <!-- Activity feed + quick actions -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);flex-wrap:wrap" id="dashboard-grid">

        <div class="card">
          <p class="card-title">Session</p>
          <div id="session-info" class="text-sm text-muted">Loading…</div>
          <div class="mt-md" data-min-role="owner">
            <button class="btn btn-outline btn-sm" id="open-new-session-btn">Start new week →</button>
          </div>
        </div>

        <div class="card">
          <p class="card-title">Recent activity</p>
          <div id="activity-feed" class="text-sm" style="max-height:200px;overflow-y:auto">
            <p class="text-muted">Loading…</p>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- New session modal -->
<dialog id="new-session-modal" style="border:none;border-radius:var(--radius-lg);padding:var(--space-xl);max-width:440px;width:90%">
  <form id="new-session-form">
    <h2 class="font-brand" style="margin-bottom:var(--space-lg)">Start New Week</h2>
    <p class="alert alert-warning">This archives the current session. All existing orders are preserved.</p>
    <div class="form-group mt-md">
      <label for="new-service-date">Service date</label>
      <input type="date" id="new-service-date" required>
    </div>
    <div class="form-group">
      <label for="new-service-title">Session title</label>
      <input type="text" id="new-service-title" placeholder="e.g. Tuesday 29th Sept" required>
    </div>
    <div class="form-group">
      <label for="new-max-pizzas">Max pizzas</label>
      <input type="number" id="new-max-pizzas" min="1" max="100" value="20" required>
    </div>
    <div class="form-group">
      <label for="new-auto-close">Auto-close at (leave blank for no auto-close)</label>
      <input type="datetime-local" id="new-auto-close">
    </div>
    <div class="flex gap-sm mt-lg" style="justify-content:flex-end">
      <button type="button" class="btn btn-outline" id="cancel-session-btn">Cancel</button>
      <button type="submit" class="btn btn-danger">Start New Week</button>
    </div>
  </form>
</dialog>

<script src="admin-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { apiGet, apiPost } = window.aoAdmin;

  async function loadDashboard() {
    const [statusData, settingsData] = await Promise.all([
      apiGet('/sessions/current'),
      apiGet('/admin/money/summary'),
    ]);

    renderMetrics(statusData, settingsData);
    renderSessionInfo(statusData);
  }

  function renderMetrics(status, money) {
    const grid = document.getElementById('metric-grid');
    const t    = money.totals || {};
    grid.innerHTML = `
      <div class="metric-card">
        <div class="metric-label">Status</div>
        <div class="metric-value" style="font-size:1.1rem">
          <span class="status-pill ${status.orderingOpen ? 'open' : 'closed'}" style="font-size:.9rem">
            ${status.orderingOpen ? 'Open' : 'Closed'}
          </span>
        </div>
        <div class="metric-hint">${status.serviceTitle || '—'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Pizzas claimed</div>
        <div class="metric-value">${status.currentPizzas ?? '—'} <span style="font-size:1rem;font-weight:400;color:var(--text-400)">/ ${status.maxPizzas ?? '—'}</span></div>
        <div class="metric-hint">${status.remainingPizzas ?? '—'} remaining</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Orders</div>
        <div class="metric-value">${t.order_count ?? '—'}</div>
        <div class="metric-hint">${t.unpaid_count ?? 0} unpaid · ${t.partial_count ?? 0} partial</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Income (collected)</div>
        <div class="metric-value">£${t.collected_pence != null ? (t.collected_pence / 100).toFixed(2) : '—'}</div>
        <div class="metric-hint">of £${t.gross_pence != null ? (t.gross_pence / 100).toFixed(2) : '—'} gross</div>
      </div>
    `;
  }

  function renderSessionInfo(s) {
    const el = document.getElementById('session-info');
    el.innerHTML = s.sessionId
      ? `<p><strong>${s.serviceTitle}</strong></p>
         <p>${s.serviceDate}</p>
         <p class="mt-sm">Auto-close: ${s.autoCloseAt ? new Date(s.autoCloseAt).toLocaleString() : 'not set'}</p>`
      : '<p>No active session.</p>';
  }

  // New session modal
  document.getElementById('open-new-session-btn')?.addEventListener('click', () => {
    document.getElementById('new-session-modal').showModal();
  });
  document.getElementById('cancel-session-btn')?.addEventListener('click', () => {
    document.getElementById('new-session-modal').close();
  });
  document.getElementById('new-session-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    const data = await apiPost('/admin/sessions', {
      serviceDate:  document.getElementById('new-service-date').value,
      serviceTitle: document.getElementById('new-service-title').value,
      maxPizzas:    parseInt(document.getElementById('new-max-pizzas').value, 10),
      autoCloseAt:  document.getElementById('new-auto-close').value || null,
    });
    if (data.success) { document.getElementById('new-session-modal').close(); loadDashboard(); }
    else alert(data.message);
  });

  // Live sync via Socket.IO (updates metrics in real time).
  const socket = window.aoAdmin.connectSocket('/admin');
  socket?.on('order:created', loadDashboard);
  socket?.on('payment:recorded', loadDashboard);

  loadDashboard();
  setInterval(loadDashboard, 30_000);
});
</script>
</body>
</html>
