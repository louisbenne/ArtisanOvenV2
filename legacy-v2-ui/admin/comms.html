      <a href="#" id="logout-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Log out</a>

  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">☰</button>
      <h1>Comms</h1>
      <span class="text-sm text-muted">Hi, <span class="js-admin-user"></span></span>
    </header>

    <div class="admin-content">

      <!-- Send confirmation -->
      <div class="card" style="margin-bottom:var(--space-xl)">
        <p class="card-title">Resend confirmation</p>
        <p class="text-sm text-muted">Re-send the order confirmation email and WhatsApp (if opted in) for a specific order.</p>
        <form id="resend-form" style="margin-top:var(--space-md);display:flex;gap:var(--space-sm);flex-wrap:wrap">
          <input type="text" id="resend-order-id" placeholder="Order code e.g. L-0012" style="flex:1;min-width:200px">
          <button type="submit" class="btn btn-forest btn-sm">Resend</button>
        </form>
        <div id="resend-feedback" class="hidden mt-sm"></div>
      </div>

      <!-- Message log -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-md)">
          <p class="card-title" style="margin:0">Message log</p>
          <button class="btn btn-outline btn-sm" id="refresh-log-btn">Refresh</button>
        </div>
        <div id="message-log" style="max-height:400px;overflow-y:auto">
          <p class="text-muted text-sm">Loading…</p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="admin-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { apiGet, apiPost } = window.aoAdmin;

  async function loadLog() {
    const data = await apiGet('/admin/comms/log');
    const log  = data.messages || data || [];
    const el   = document.getElementById('message-log');
    if (!log.length) { el.innerHTML = '<p class="text-muted text-sm">No messages yet.</p>'; return; }
    el.innerHTML = `<table class="data-table" style="font-size:.85rem">
      <thead><tr><th>Time</th><th>Order</th><th>Channel</th><th>Status</th><th>Preview</th></tr></thead>
      <tbody>${log.map(m => `
        <tr>
          <td class="text-muted">${new Date(m.sentAt || m.created_at).toLocaleString('en-GB', {dateStyle:'short',timeStyle:'short'})}</td>
          <td><strong>${escHtml(m.orderCode || m.order_code || '—')}</strong></td>
          <td>${escHtml(m.channel || '—')}</td>
          <td><span class="badge ${m.status === 'delivered' || m.status === 'sent' ? 'badge-success' : m.status === 'failed' ? 'badge-error' : 'badge-muted'}">${escHtml(m.status || '—')}</span></td>
          <td class="text-muted" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(m.preview || m.body_preview || '')}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  document.getElementById('resend-form').addEventListener('submit', async e => {
    e.preventDefault();
    const orderId = document.getElementById('resend-order-id').value.trim().toUpperCase();
    const fb = document.getElementById('resend-feedback');
    fb.classList.add('hidden');
    if (!orderId) return;
    const data = await apiPost('/admin/comms/send', { orderId });
    fb.className = `alert ${data.success ? 'alert-success' : 'alert-error'} mt-sm`;
    fb.textContent = data.success ? `Confirmation resent for ${orderId}.` : (data.message || 'Failed to send.');
    fb.classList.remove('hidden');
    if (data.success) loadLog();
  });

  document.getElementById('refresh-log-btn').addEventListener('click', loadLog);

  loadLog();
});

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
